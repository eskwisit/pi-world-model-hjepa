name: Release

# Publishes a GitHub release with the packaged .piplug whenever a push to main
# carries a manifest version that has not been released yet. Bump "version" in
# manifest.json to cut a new release; pushes without a bump are skipped.
#
# The release notes are the version's section of CHANGELOG.md. Every push to main
# also refreshes the notes of the current version's release, so a changelog fix
# shows up on the release page. Run the workflow by hand with "all" to copy the
# changelog onto every existing release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Copy the CHANGELOG.md notes onto every existing release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read manifest
        id: manifest
        run: |
          id=$(jq -er '.id' manifest.json)
          name=$(jq -er '.name' manifest.json)
          version=$(jq -er '.version' manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=manifest.json::version '$version' is not semver"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Release $TAG already exists; bump the version in manifest.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read release notes
        id: notes
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if .github/scripts/changelog-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning file=CHANGELOG.md::no section for $VERSION; the release gets generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        if: steps.check.outputs.exists == 'false'
        id: package
        env:
          ID: ${{ steps.manifest.outputs.id }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          out="dist/${ID}-${VERSION}.piplug"
          mkdir -p dist
          # Tracked runtime files only (no CI config, docs images, dev skills, tests or
          # .gitignore); stored (uncompressed) zip with fixed timestamps so the archive
          # matches the local plugin packer.
          git ls-files -z -- . ':!:.github/**' ':!:docs/**' ':!:.agents/**' ':!:tests/**' ':!:.gitignore' > "$RUNNER_TEMP/files"
          xargs -0 touch -h -d '1980-01-01 00:00:00' < "$RUNNER_TEMP/files"
          xargs -0 zip -X -0 -D "$out" < "$RUNNER_TEMP/files"
          unzip -l "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
          NAME: ${{ steps.manifest.outputs.name }}
          FOUND: ${{ steps.notes.outputs.found }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if [ "$FOUND" = true ]; then notes=(--notes-file "$NOTES"); else notes=(--generate-notes); fi
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "$NAME $VERSION" \
            "${notes[@]}"

      - name: Refresh release notes
        if: steps.check.outputs.exists == 'true' && steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
          fi

      - name: Copy the changelog onto every release
        if: github.event_name == 'workflow_dispatch' && inputs.all
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(awk '/^## / { print $2 }' CHANGELOG.md); do
            if ! gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version: no release, skipped"
              continue
            fi
            .github/scripts/changelog-notes.sh "$version" > "$RUNNER_TEMP/notes-$version.md"
            gh release edit "v$version" --notes-file "$RUNNER_TEMP/notes-$version.md"
            echo "v$version: notes updated"
          done
